# Dependency updates for the build tooling only — the game ships no runtime dependencies.
# Protects the published bundle from a compromised dev package, and keeps the SHA-pinned
# actions in deploy.yml current (a pinned SHA is updated by Dependabot, unlike a moving tag).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
